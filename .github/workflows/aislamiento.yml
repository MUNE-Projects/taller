# Prueba de aislamiento entre promotoras.
#
# Cada vez que una propuesta cambia las reglas de la base de datos o la propia
# prueba, levanta un Supabase vacío dentro de GitHub (con datos inventados,
# sin tocar el real ni usar ninguna llave), aplica los archivos de
# panel/supabase en orden y comprueba que ninguna promotora puede ver ni tocar
# lo de otra. Si sale en rojo, esa propuesta NO se aprueba.
#
# El resultado, con la lista de comprobaciones, aparece en la pestaña
# «Checks» de la propuesta y en el resumen del proceso.

name: Prueba de aislamiento

on:
  pull_request:
    paths:
      - panel/supabase/**
      - panel/pruebas/**
      - .github/workflows/aislamiento.yml
  push:
    branches: [main]
    paths:
      - panel/supabase/**
      - panel/pruebas/**
      - .github/workflows/aislamiento.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aislamiento:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias del Panel
        working-directory: panel
        run: npm ci --no-audit --no-fund
      - name: Supabase local y comprobaciones
        working-directory: panel
        run: bash pruebas/lanzar.sh
