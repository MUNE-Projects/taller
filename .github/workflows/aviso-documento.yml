# Aviso «documentación nueva»: cada vez que una promotora sube un documento en
# su portal, la función «aviso-subida» de Supabase lanza este proceso. Escribe
# en el aviso abierto de esa promoción (o abre uno nuevo), y GitHub envía el
# email a quien vigila el almacén, igual que con «versión lista para revisar».
#
# Un aviso por promoción: las subidas siguientes se añaden como comentarios.
# Se puede cerrar cuando esté todo revisado; la siguiente subida abre otro.

name: Aviso de documentación nueva
run-name: documentación ${{ inputs.promocion }}

on:
  workflow_dispatch:
    inputs:
      promocion:
        required: true
        type: string
      nombre:
        required: true
        type: string
      promotora:
        required: false
        type: string
        default: ''
      documento:
        required: true
        type: string
      archivo:
        required: true
        type: string
      version:
        required: true
        type: string
      persona:
        required: false
        type: string
        default: ''

permissions:
  issues: write

concurrency:
  group: aviso-documento-${{ inputs.promocion }}
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PROMOCION: ${{ inputs.promocion }}
      NOMBRE: ${{ inputs.nombre }}
      PROMOTORA: ${{ inputs.promotora }}
      DOCUMENTO: ${{ inputs.documento }}
      ARCHIVO: ${{ inputs.archivo }}
      VERSION: ${{ inputs.version }}
      PERSONA: ${{ inputs.persona }}
    steps:
      - name: Escribir el aviso
        run: |
          [[ "$PROMOCION" =~ ^[a-z0-9-]{1,60}$ ]] || { echo "::error::Promoción no válida"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]{1,5}$ ]] || { echo "::error::Versión no válida"; exit 1; }
          for v in "$NOMBRE" "$PROMOTORA" "$DOCUMENTO" "$PERSONA"; do [[ ${#v} -le 120 ]] || { echo "::error::Texto demasiado largo"; exit 1; }; done
          [[ ${#ARCHIVO} -le 200 ]] || { echo "::error::Nombre de archivo demasiado largo"; exit 1; }
          # El texto viene del portal: sin saltos de línea ni comillas de código, y
          # las @ desactivadas para que nadie pueda mencionar a usuarios de GitHub.
          limpio() { printf '%s' "$1" | tr -d '`\r\n' | sed 's/@/(arroba)/g'; }
          titulo="$(limpio "$NOMBRE") · documentación nueva"
          linea="- **$(limpio "${PERSONA:-Alguien}")** ha subido **$(limpio "$DOCUMENTO")** (versión $VERSION): \`$(limpio "$ARCHIVO")\`"
          gh label create documentacion --repo "$REPO" --color 2F5D50 \
            --description "Documentación nueva subida por una promotora" 2>/dev/null || true
          export TITULO="$titulo"
          abierto=$(gh issue list --repo "$REPO" --label documentacion --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == $ENV.TITULO) | .number' | head -n1)
          if [[ -n "$abierto" ]]; then
            gh issue comment "$abierto" --repo "$REPO" --body "$linea"
          else
            cuerpo=$(printf '%s\n' \
              "## 📄 Documentación nueva de $(limpio "$NOMBRE")${PROMOTORA:+ ($(limpio "$PROMOTORA"))}" "" \
              "$linea" "" \
              "**Revísala en MUNE Studio:** https://panel.mune-projects.workers.dev/#/promocion/$PROMOCION/documentacion" "" \
              "_Las próximas subidas de esta promoción se añadirán aquí como comentarios. Puedes cerrar este aviso cuando esté todo revisado._")
            gh issue create --repo "$REPO" --label documentacion --title "$titulo" --body "$cuerpo"
          fi
