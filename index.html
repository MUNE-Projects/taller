<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Vivienda en planta baja · visor 3D</title>
	<meta name="description" content="Visualización 3D de una vivienda de obra nueva a partir de su plano, con personalización de distribución y acabados." />
</head>
<body data-estado="4" data-modo="vivienda">
	<div id="lienzo" aria-hidden="true"></div>
	<div id="etiquetas" aria-hidden="true"></div>
	<div id="velo" aria-hidden="true"></div>

	<header class="ficha">
		<p class="antetitulo">Planta baja · Puerta A</p>
		<h1>Vivienda de 2 dormitorios</h1>
		<p class="datos"><span id="util-interior">88,18 m²</span> útiles · 2 baños · terraza y porche de 32,71 m²</p>
		<p id="total-ficha" class="total-ficha" hidden></p>
	</header>

	<div class="dock">
		<div class="vistas" role="toolbar" aria-label="Vistas de la vivienda">
			<button type="button" data-vista="aerea" aria-pressed="true">Vista general</button>
			<button type="button" data-vista="salon" aria-pressed="false">Salón</button>
			<button type="button" data-vista="cocina" aria-pressed="false">Cocina</button>
			<button type="button" data-vista="dormitorio" aria-pressed="false">Dormitorio</button>
			<button type="button" data-vista="bano" aria-pressed="false">Baño</button>
			<button type="button" data-vista="terraza" aria-pressed="false">Terraza</button>
			<span class="separador" aria-hidden="true"></span>
			<button type="button" id="foto" class="foto" aria-label="Capturar imagen de esta vista" title="Capturar imagen">
				<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h2l1.2-1.6h4.6L13.5 5h2A1.5 1.5 0 0 1 17 6.5v8A1.5 1.5 0 0 1 15.5 16h-11A1.5 1.5 0 0 1 3 14.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10.3" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
			</button>
		</div>
		<nav class="modos" aria-label="Modo">
			<button type="button" data-modo="plano">Plano</button>
			<button type="button" data-modo="vivienda" aria-current="true">Vivienda</button>
			<button type="button" data-modo="personalizar">Personalizar</button>
		</nav>
	</div>

	<aside id="configurador" class="configurador" aria-label="Personaliza tu vivienda" hidden>
		<header class="cabecera">
			<h2>Personaliza tu vivienda</h2>
			<button type="button" class="cerrar" aria-label="Cerrar personalización">
				<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
			</button>
		</header>
		<div class="opciones"></div>
		<footer class="precio">
			<div class="linea-total">
				<span>Precio total</span>
				<strong data-precio="total"></strong>
			</div>
			<button type="button" class="ver-desglose" aria-expanded="false" aria-controls="desglose">
				<span class="cuenta"></span><span class="accion">Desglose</span>
			</button>
			<div class="desglose" id="desglose" hidden>
				<div class="fila"><span>Precio base vivienda</span><span data-precio="base"></span></div>
				<ul class="extras"></ul>
				<div class="fila"><span>Total de extras</span><span data-precio="extras"></span></div>
			</div>
			<button type="button" class="guardar">Guardar configuración</button>
		</footer>
	</aside>

	<div id="aviso" class="aviso" role="status" aria-live="polite" hidden>
		<p class="texto"></p>
		<button type="button" class="accion" hidden></button>
	</div>

	<dialog id="resumen-configuracion" aria-labelledby="titulo-resumen">
		<h2 id="titulo-resumen">Tu configuración</h2>
		<div class="contenido"></div>
		<div class="acciones">
			<button type="button" class="copiar">Copiar resumen</button>
			<button type="button" class="cerrar-dialogo">Cerrar</button>
		</div>
	</dialog>

	<footer class="pie"><span id="motor"></span></footer>

	<div id="captura" role="dialog" aria-modal="true" aria-label="Imagen capturada" hidden>
		<figure>
			<img alt="Imagen renderizada de la vista actual" />
			<figcaption>
				<span>Clic derecho o pulsación larga sobre la imagen para guardarla.</span>
				<span class="acciones"><a download>Descargar PNG</a><button type="button">Cerrar</button></span>
			</figcaption>
		</figure>
	</div>

	<div id="carga" role="status">Preparando la vivienda…</div>

	<script type="module" src="/src/main.ts"></script>
</body>
</html>
