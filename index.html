<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Vivienda en planta baja · visor 3D</title>
	<meta name="description" content="Visualización arquitectónica 3D de una vivienda a partir de su plano: planta, volúmenes, modelo y vivienda terminada." />
</head>
<body data-estado="1">
	<div id="lienzo" aria-hidden="true"></div>
	<div id="etiquetas" aria-hidden="true"></div>

	<header class="ficha">
		<p class="antetitulo">Caso de prueba · Planta baja, puerta A</p>
		<h1>Vivienda de 2 dormitorios y 2 baños</h1>
		<dl class="datos">
			<div><dt>Útil interior</dt><dd>88,18 m²</dd></div>
			<div><dt>Terraza y porche</dt><dd>32,71 m²</dd></div>
		</dl>
		<p class="lema" id="lema" aria-live="polite">Distribución en planta</p>
	</header>

	<nav class="estados" aria-label="Estado de la visualización">
		<button type="button" data-estado="1" aria-current="true"><span class="num">01</span><span class="txt">Plano</span></button>
		<button type="button" data-estado="2"><span class="num">02</span><span class="txt">Volúmenes</span></button>
		<button type="button" data-estado="3"><span class="num">03</span><span class="txt">Modelo</span></button>
		<button type="button" data-estado="4"><span class="num">04</span><span class="txt">Vivienda</span></button>
	</nav>

	<aside class="vistas" aria-label="Vistas">
		<p class="titulo-panel">Vistas</p>
		<button type="button" data-vista="planta" aria-pressed="true">Planta</button>
		<button type="button" data-vista="aerea" aria-pressed="false">Aérea</button>
		<button type="button" data-vista="salon" aria-pressed="false">Salón</button>
		<button type="button" data-vista="cocina" aria-pressed="false">Cocina</button>
		<button type="button" data-vista="dormitorio" aria-pressed="false">Dormitorio</button>
		<button type="button" data-vista="terraza" aria-pressed="false">Terraza</button>
		<button type="button" id="foto" class="foto">Capturar imagen</button>
	</aside>

	<ul class="leyenda" aria-label="Leyenda de usos">
		<li style="--c:#e7c9a4">Día</li>
		<li style="--c:#b9c6d3">Noche</li>
		<li style="--c:#a9cbc6">Baños</li>
		<li style="--c:#e3ddd3">Circulación</li>
		<li style="--c:#cfc6b4">Servicio</li>
		<li style="--c:#c9d3bb">Exterior</li>
	</ul>

	<footer class="pie">
		<span>Medidas tomadas del plano comercial, ±10 cm</span>
		<span id="motor"></span>
	</footer>

	<div id="captura" role="dialog" aria-modal="true" aria-label="Imagen capturada" hidden>
		<figure>
			<img alt="Imagen renderizada de la vista actual" />
			<figcaption>
				<span>Clic derecho o pulsación larga sobre la imagen para guardarla.</span>
				<span class="acciones"><a download>Descargar PNG</a><button type="button">Cerrar</button></span>
			</figcaption>
		</figure>
	</div>

	<div id="carga" role="status">Generando la vivienda…</div>

	<script type="module" src="/src/main.ts"></script>
</body>
</html>
